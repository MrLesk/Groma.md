name: Set up the Swift scanner toolchain
description: Install the compiler and native packaging tools used by scanner builds and tests
runs:
  using: composite
  steps:
    # On a runner image without this Swift, setup-swift downloads Swiftly and checks its signature against a keyring it
    # never fills, so the step fails. swift-keys.asc is https://www.swift.org/keys/all-keys.asc, kept here because that
    # URL sometimes answers runners without the keys.
    - name: Import the Swift signing keys
      if: runner.os == 'Linux'
      run: gpg --import "$GITHUB_ACTION_PATH/swift-keys.asc"
      shell: bash
    - uses: swift-actions/setup-swift@v3
      if: runner.os != 'Windows'
      with:
        swift-version: '6.3.3'
    - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
      if: runner.os == 'Windows'
      with:
        swift-version: swift-6.3.3-release
        swift-build: 6.3.3-RELEASE
        build_arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
    - name: Install Linux library packaging tool
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y patchelf
      shell: bash
