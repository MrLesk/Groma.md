name: Scanner research Backlog CLI
on:
  push:
    branches: [research/csharp-scanner-prototype]
    paths: [.github/workflows/csharp-backlog-bootstrap.yml]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-22.04
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - shell: bash
        run: |
          set -euo pipefail
          bun add --global backlog.md@1.51.0
          directory="$(dirname "$(readlink -f "$HOME/.bun/bin/backlog")")"
          binary="$(node -e 'console.log(require(process.argv[1] + "/resolveBinary.cjs").resolveBinaryPath())' "$directory")"
          cp "$binary" /tmp/backlog
          /tmp/backlog --version
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-research-backlog-cli
          path: /tmp/backlog
          compression-level: 1
          retention-days: 3
