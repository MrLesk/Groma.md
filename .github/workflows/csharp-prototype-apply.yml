name: Apply verified CSharp prototype
on:
  push:
    branches: [research/csharp-scanner-prototype]
    paths: [.github/workflows/csharp-prototype-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/csharp-scanner-prototype
      - name: Verify and apply tested source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          compressed = b''.join(Path(f'.csharp-prototype-transfer/{i}').read_bytes() for i in range(6))
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '861ef5e2c0db05ac7309922e9a181d9471a7012e68863e37fc8d0e38a77c171c'
          Path('/tmp/prototype.patch').write_bytes(patch)
          PY
          git apply --check --exclude=.github/workflows/csharp-scanner.yml /tmp/prototype.patch
          git apply --index --exclude=.github/workflows/csharp-scanner.yml /tmp/prototype.patch
          git rm -r .csharp-prototype-transfer
          git diff --cached --check
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git commit -m 'TASK-324 - Prototype project-aware C# scanning and explicit setup'
          git push origin HEAD:research/csharp-scanner-prototype
          git rev-parse HEAD
