name: TUI graphics research
on:
  push:
    branches: [research/tui-graphics-prototype]
permissions:
  contents: read
jobs:
  terminal-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned terminal tester
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/microsoft/tui-test/releases/download/0.1.0-beta.3/tui-test-x86_64-unknown-linux-gnu.tar.gz -o /tmp/tui-test.tar.gz
          echo '35d0cfff1b3d6cfeba3abb0eeae7537c5722c36414106ca28b142e5e48235a37  /tmp/tui-test.tar.gz' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: tui-test-tool
          path: /tmp/tui-test.tar.gz
          retention-days: 1
