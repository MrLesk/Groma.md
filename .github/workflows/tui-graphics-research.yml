name: Validate and publish 2D-only terminal refinement
on:
  push:
    branches: [research/tui-graphics-prototype]
    paths: [.github/workflows/tui-graphics-research.yml]
permissions:
  contents: write
jobs:
  refine:
    if: github.ref == 'refs/heads/research/tui-graphics-prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Apply verified branch-scoped change
        env:
          PATCH: 
        run: |
          python3 - <<'PY'
          import os, base64, zlib, hashlib, subprocess
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH']))
          assert hashlib.sha256(patch).hexdigest() == '2d79b48bbe63b3cdcaef6927639f1da74d58891466eefb7d95322d63c0d02614'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
      - name: Check and build
        run: |
          bun install --frozen-lockfile
          bun run check > /tmp/2d-check.log 2>&1 || { tail -100 /tmp/2d-check.log; exit 1; }
          bun run build
          bun scripts/smoke-compiled-build.ts dist/groma 0.2.0
      - name: Publish only this research branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/research/tui-graphics-prototype'
          git rm .github/workflows/tui-graphics-research.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'TASK-324 - Render the terminal map as keyboard-first graphics' -m 'Use a fixed 2D terminal plan; remove isometric controls and wall painting.'
          git push origin HEAD:refs/heads/research/tui-graphics-prototype
          git rev-parse HEAD > /tmp/2d-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-2d-refinement-checks
          path: |
            /tmp/2d-check.log
            /tmp/2d-commit.txt
          retention-days: 7
