name: Blueprint research
on:
  push:
    branches: [research/blueprint-store-prototype]
    paths:
      - '.github/workflows/blueprint-research.yml'
      - 'research/blueprints/**'
      - 'test-bun/blueprint-*.test.ts'
      - 'test/fixtures/blueprint-research/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blueprint-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize submitted map-view source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f research/blueprints/map-view-source.01; then
            cat research/blueprints/map-view-source.01 research/blueprints/map-view-source.02 > "$RUNNER_TEMP/map-view-source.tar.xz"
            echo "12a255e84e83374ded8c897fcc8c66d15c421cf22525b3889f195a8737006f0a  $RUNNER_TEMP/map-view-source.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/map-view-source.tar.xz"
            rm research/blueprints/map-view-source.01 research/blueprints/map-view-source.02
            git add research/blueprints test-bun/blueprint-map-views.test.ts 'backlog/tasks/task-325 - Switch-blueprint-editor-between-isometric-2D-and-layered-maps.md'
            git commit -m 'TASK-325 - Switch blueprint editor between isometric, 2D and layered maps'
            git push origin HEAD:research/blueprint-store-prototype
          fi
      - name: Install and read repository workflow
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          npm install --prefix "$RUNNER_TEMP/backlog-tools" backlog.md@1.51.0
          echo "$RUNNER_TEMP/backlog-tools/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/backlog-tools/node_modules/.bin:$PATH"
          backlog instructions overview
          backlog instructions task-execution
          backlog task view TASK-325 --plain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Test, build and capture
        env:
          BLUEPRINT_TRACK_TASK: TASK-325
        run: python research/blueprints/verify.py
      - name: Preserve measured results
        if: always()
        run: |
          set -euo pipefail
          if python -c "import json,subprocess; assert json.load(open('research/blueprints/evidence/checks.json'))['sourceCommit'] == subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()"; then
            backlog task edit TASK-325 --append-notes "Recorded the actual check results and map-view browser captures from GitHub run $GITHUB_RUN_ID. See evidence/checks.json for the tested source and exit codes."
            git add research/blueprints/evidence 'backlog/tasks/task-325 - Switch-blueprint-editor-between-isometric-2D-and-layered-maps.md'
            if ! git diff --cached --quiet; then
              git commit -m 'TASK-325 - Switch blueprint editor between isometric, 2D and layered maps'
              git push origin HEAD:research/blueprint-store-prototype
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blueprint-map-view-results
          path: |
            dist/blueprint-research/index.html
            research/blueprints
            test/fixtures/blueprint-research
            test-bun/blueprint-*.test.ts
            backlog/tasks/task-325 - Switch-blueprint-editor-between-isometric-2D-and-layered-maps.md
          retention-days: 30
