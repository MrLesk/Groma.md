name: Java research dependencies
on:
  push:
    branches: [research/java-scanner-prototype]
    paths: [.github/workflows/java-research-dependencies.yml]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: spring-projects/spring-petclinic
          ref: 818c4136ea971c21674525f9053de0d9c7ad8cfe
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Explicit trusted-build dependency export for research only
        run: |
          set -euo pipefail
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath -DincludeScope=compile -Dmdep.outputFile="$RUNNER_TEMP/classpath.txt"
          mkdir -p "$RUNNER_TEMP/dependencies/lib"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          jars=[pathlib.Path(p) for p in (root/'classpath.txt').read_text().strip().split(os.pathsep)]
          manifest=[]
          for jar in jars:
            digest=hashlib.sha256(jar.read_bytes()).hexdigest()
            target=root/'dependencies/lib'/f'{digest[:12]}-{jar.name}'
            shutil.copyfile(jar,target)
            manifest.append({'file':str(target.relative_to(root/'dependencies')),'sha256':digest})
          (root/'dependencies/manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/dependencies/COMMIT"
          tar -czf "$RUNNER_TEMP/petclinic-dependencies.tar.gz" -C "$RUNNER_TEMP/dependencies" .
      - uses: actions/upload-artifact@v4
        with:
          name: petclinic-dependencies
          path: ${{ runner.temp }}/petclinic-dependencies.tar.gz
          retention-days: 2
