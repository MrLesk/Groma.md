name: Rust research workspace
on:
  push:
    branches: [research/rust-scanner-prototype]
    paths: [.github/workflows/rust-research-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Prepare repository and tools
        run: |
          set -euxo pipefail
          bun install --frozen-lockfile
          mkdir -p /tmp/rust-research/tools /tmp/rust-research/corpus /tmp/rust-research/seed/src
          npm install --prefix /tmp/rust-research/tools backlog.md@1.51.0
          /tmp/rust-research/tools/node_modules/.bin/backlog instructions overview
          /tmp/rust-research/tools/node_modules/.bin/backlog instructions task-creation
          /tmp/rust-research/tools/node_modules/.bin/backlog instructions task-execution
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          cp "$(command -v bun)" /tmp/rust-research/tools/bun
          cp -a "$HOME/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu" /tmp/rust-research/tools/rust
          cat > /tmp/rust-research/seed/Cargo.toml <<'EOF'
          [package]
          name = "groma-rust-research-seed"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          syn = { version = "=2.0.106", features = ["full", "visit", "extra-traits"] }
          proc-macro2 = { version = "=1.0.101", features = ["span-locations"] }
          quote = "=1.0.40"
          serde = { version = "=1.0.219", features = ["derive"] }
          serde_json = "=1.0.143"
          toml = "=0.9.5"
          glob = "=0.3.3"
          EOF
          printf 'fn main() {}\n' > /tmp/rust-research/seed/src/main.rs
          cd /tmp/rust-research/seed
          cargo +1.90.0 generate-lockfile
          mkdir .cargo
          cargo +1.90.0 vendor ../vendor > .cargo/config.toml
          git clone --depth 1 --branch 14.1.1 https://github.com/BurntSushi/ripgrep.git /tmp/rust-research/corpus/ripgrep
          git -C /tmp/rust-research/corpus/ripgrep rev-parse HEAD > /tmp/rust-research/corpus/ripgrep.commit
          cd "$GITHUB_WORKSPACE"
          tar --exclude=.git --exclude='./.github/assets/*.gif' --exclude='./.github/assets/*.webp' -czf /tmp/rust-research/groma.tar.gz .
          cd /tmp/rust-research
          tar -czf /tmp/rust-research-workspace.tar.gz tools seed vendor corpus groma.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rust-research-workspace
          path: /tmp/rust-research-workspace.tar.gz
          retention-days: 3
          compression-level: 0
