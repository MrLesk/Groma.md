name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash
      - name: Run repository checks
        run: bun run check
        shell: bash
      - name: Build standalone binary
        run: bun run build
        shell: bash
      - name: Smoke-test standalone binary
        run: |
          binary="dist/groma"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          bun scripts/smoke-compiled-build.ts "$binary" "$version"
        shell: bash
      - name: Build self-contained Java scanner package
        if: runner.os != 'Windows'
        run: bun plugins/scanners/java/build.ts --runtime
        shell: bash
      - name: Smoke-test Java without external language runtimes
        if: runner.os != 'Windows'
        run: bun scripts/smoke-java-scanner.ts dist/groma plugins/scanners/java/dist/package
        shell: bash
