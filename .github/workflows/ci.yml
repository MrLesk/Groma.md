name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache Swift test package
        id: swift-package
        uses: actions/cache@v6
        with:
          path: scanner-packages/swift
          key: >-
            swift-test-package-${{ matrix.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles(
              '.github/actions/setup-swift/action.yml',
              'plugins/scanners/swift/**',
              'plugins/scanners/projects.ts',
              'packages/scanner/**',
              'docs/scanners/swift/**',
              'bun.lock', 'LICENSE') }}
      - uses: ./.github/actions/setup-swift
        if: steps.swift-package.outputs.cache-hit != 'true'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash
      - name: Build Swift test package
        if: steps.swift-package.outputs.cache-hit != 'true'
        run: bun plugins/scanners/swift/build.ts scanner-packages/swift
        shell: bash
      - name: Run repository checks
        env:
          GROMA_TEST_SWIFT_PACKAGE: scanner-packages/swift
        run: bun run check
        shell: bash
      - name: Build standalone binary
        run: bun run build
        shell: bash
