name: Apply validated Rust research patch
on:
  push:
    branches: [research/rust-scanner-prototype]
    paths: [.github/workflows/rust-research-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rust-scanner-prototype
      - name: Verify and commit research patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/research/rust-scanner-prototype
          : > /tmp/prototype.patch.xz
          for sha in 725b0d07fccede043ddc45e2b440f17d16ac5731 5ff84f45015ebcca6c326a3e7851e105d0cb4cf3 80344ff47aebbaab38839454639864df03be3f3f 5d32322f4196d08e4f75819f1f88dea87d59f9a8 3ced21e56232d293314eb6ddde2707807d73c13b be985641d383680556d2ce29a6354d99db34dbf2; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' | base64 --decode >> /tmp/prototype.patch.xz
          done
          echo 'd89d8cbd1bcbadf72d524a9f3cf7cba2e2faa4e6494309f445cc6a305919e3b7  /tmp/prototype.patch.xz' | sha256sum --check -
          xz -dc /tmp/prototype.patch.xz > /tmp/prototype.patch
          echo 'cea3ecf3d15732a5480de4a1c1c8403017841f4db1fc45704bc00a0513d9e473  /tmp/prototype.patch' | sha256sum --check -
          git apply --check --index /tmp/prototype.patch
          git apply --index /tmp/prototype.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'TASK-228.5 - Prototype Rust scanning and document production delivery'
          git push origin HEAD:refs/heads/research/rust-scanner-prototype
