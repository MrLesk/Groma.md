name: Release

# Publishing a GitHub release creates its tag and starts this workflow; the tag names the version.
on:
  workflow_dispatch:
    inputs:
      publish_scanners:
        description: Publish changed scanner packages without releasing Groma
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 22

jobs:
  validate:
    name: validate-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-swift
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set version from tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const [version] = process.argv.slice(2)
          const filename = 'package.json'
          const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'))
          manifest.version = version
          fs.writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
      - name: Install all Bun target dependencies
        run: bun install --frozen-lockfile --os="*" --cpu="*"
      - name: Run repository checks
        run: bun run check

  build-scanners:
    name: build-scanners-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-latest
            platform: win32-x64
          - runner: windows-11-arm
            platform: win32-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache SwiftSyntax build
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: .groma/swift-syntax-build
          key: >-
            swift-syntax-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
              '.github/actions/setup-swift/action.yml',
              'plugins/scanners/swift/Package.swift') }}
      - uses: ./.github/actions/setup-swift
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.platform == 'win32-arm64' && 'microsoft' || 'temurin' }}
          java-version: '25'
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/scanners/go/worker/go.mod
          cache-dependency-path: plugins/scanners/go/worker/go.sum
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install Rust build toolchain
        run: rustup toolchain install 1.91.1 --profile minimal
        shell: bash
      - name: Select Rust build toolchain
        run: rustup override set 1.91.1
        shell: bash
      - name: Install build dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          dotnet restore plugins/scanners/csharp/dotnet/Groma.CSharpScanner.csproj --locked-mode
        shell: bash
      - name: Build runnable scanner packages
        env:
          GROMA_SWIFT_PM_CACHE: ${{ github.workspace }}/.groma/swift-syntax-build
        run: bun scripts/scanner-release.ts stage scanner-packages
        shell: bash
      - name: Check Swift evidence and installed worker
        run: GROMA_TEST_SWIFT_PACKAGE=scanner-packages/swift bun test test-bun/swift-scanner.test.ts
        shell: bash
      - name: Check fresh checkouts without project tools
        run: GROMA_TEST_PACKAGES=scanner-packages bun test --timeout 60000 test-bun/scanner-fresh-checkout.test.ts
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: scanner-packages-${{ matrix.platform }}
          path: scanner-packages
          if-no-files-found: error

  publish-scanners:
    if: github.event_name == 'release' || inputs.publish_scanners
    name: publish-official-scanners
    needs: [validate, build-scanners]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: scanner-packages-*
          path: scanner-artifacts
      - name: Assemble scanner packages
        run: bun scripts/scanner-release.ts assemble scanner-artifacts scanner-packages
      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11
      - name: Publish contract and official scanners
        run: bun scripts/scanner-release.ts publish scanner-packages
        env:
          NPM_CONFIG_PROVENANCE: true
      - uses: actions/upload-artifact@v7
        with:
          name: published-scanner-packages
          path: scanner-packages
          if-no-files-found: error

  build:
    if: github.event_name == 'release'
    name: build-${{ matrix.target }}
    needs: publish-scanners
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            binary: groma
            package: groma.md-linux-x64
            npm_os: linux
            npm_cpu: x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: groma
            package: groma.md-linux-arm64
            npm_os: linux
            npm_cpu: arm64
          - runner: macos-15
            target: bun-darwin-arm64
            binary: groma
            package: groma.md-darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - runner: windows-latest
            target: bun-windows-x64-baseline
            binary: groma.exe
            package: groma.md-windows-x64
            npm_os: win32
            npm_cpu: x64
          - runner: windows-11-arm
            target: bun-windows-arm64
            binary: groma.exe
            package: groma.md-windows-arm64
            npm_os: win32
            npm_cpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const [version] = process.argv.slice(2)
          const filename = 'package.json'
          const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'))
          manifest.version = version
          fs.writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        shell: bash
      - name: Install all Bun target dependencies
        run: bun install --frozen-lockfile --os="*" --cpu="*"
        shell: bash
      - uses: actions/download-artifact@v8
        with:
          name: published-scanner-packages
          path: published-scanner-packages
      - name: Embed published scanner metadata
        run: bun scripts/scanner-release.ts catalog published-scanner-packages
        shell: bash
      - name: Build standalone binary
        env:
          GROMA_BUILD_TARGET: ${{ matrix.target }}
          GROMA_BUILD_OUTFILE: dist/${{ matrix.binary }}
        run: bun scripts/build.ts
        shell: bash
      - name: Make Unix binary executable
        if: matrix.npm_os != 'win32'
        run: chmod +x "dist/${{ matrix.binary }}"
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: groma-${{ matrix.target }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  release-assets:
    name: release-assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: groma-*
          path: release-artifacts
      - name: Assemble release binaries and checksums
        run: |
          mkdir -p release
          for artifact in release-artifacts/groma-*/; do
            target="${artifact#release-artifacts/groma-}"
            target="${target%/}"
            binary="$(find "$artifact" -maxdepth 1 -type f | head -1)"
            if [[ "$binary" == *.exe ]]; then
              name="groma-${target}.exe"
            else
              name="groma-${target}"
            fi
            cp "$binary" "release/$name"
          done
          (cd release && sha256sum groma-* > SHA256SUMS)
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber

  publish-platform:
    name: publish-${{ matrix.package }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64-baseline
            binary: groma
            package: groma.md-linux-x64
            npm_os: linux
            npm_cpu: x64
          - target: bun-linux-arm64
            binary: groma
            package: groma.md-linux-arm64
            npm_os: linux
            npm_cpu: arm64
          - target: bun-darwin-arm64
            binary: groma
            package: groma.md-darwin-arm64
            npm_os: darwin
            npm_cpu: arm64
          - target: bun-windows-x64-baseline
            binary: groma.exe
            package: groma.md-windows-x64
            npm_os: win32
            npm_cpu: x64
          - target: bun-windows-arm64
            binary: groma.exe
            package: groma.md-windows-arm64
            npm_os: win32
            npm_cpu: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: groma-${{ matrix.target }}
          path: artifact
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Prepare platform package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p package
          cp "artifact/${{ matrix.binary }}" "package/${{ matrix.binary }}"
          cp LICENSE package/
          if [[ "${{ matrix.npm_os }}" != "win32" ]]; then
            chmod +x "package/${{ matrix.binary }}"
          fi
          node - "$version" "${{ matrix.package }}" "${{ matrix.npm_os }}" "${{ matrix.npm_cpu }}" "${{ matrix.binary }}" <<'NODE'
          const fs = require('node:fs')
          const [version, name, os, cpu, binary] = process.argv.slice(2)
          const manifest = {
            name,
            version,
            description: 'Groma standalone architecture CLI',
            license: 'MIT',
            repository: { type: 'git', url: 'https://github.com/MrLesk/groma.md.git' },
            os: [os],
            cpu: [cpu],
            files: [binary, 'package.json', 'LICENSE'],
          }
          fs.writeFileSync('package/package.json', `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        shell: bash
      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11
      - name: Publish platform package
        working-directory: package
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-wrapper:
    name: publish-groma.md
    needs: publish-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Prepare npm wrapper package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p package
          cp scripts/npm/cli.cjs package/cli.cjs
          cp README.md LICENSE package/
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const [version] = process.argv.slice(2)
          const platformPackages = [
            'groma.md-linux-x64',
            'groma.md-linux-arm64',
            'groma.md-darwin-arm64',
            'groma.md-windows-x64',
            'groma.md-windows-arm64',
          ]
          const manifest = {
            name: root.name,
            version,
            description: root.description,
            license: root.license,
            author: root.author,
            homepage: root.homepage,
            repository: root.repository,
            bugs: root.bugs,
            keywords: root.keywords,
            engines: { node: '>=20.19.0' },
            bin: { groma: 'cli.cjs' },
            files: ['cli.cjs', 'package.json', 'README.md', 'LICENSE'],
            optionalDependencies: Object.fromEntries(platformPackages.map(name => [name, version])),
          }
          fs.writeFileSync('package/package.json', `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        shell: bash
      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11
      - name: Publish groma.md
        working-directory: package
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  sync-version:
    name: sync-version-to-main
    needs: [release-assets, publish-wrapper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set released version in main checkout
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const fs = require('node:fs')
          const [version] = process.argv.slice(2)
          const filename = 'package.json'
          const manifest = JSON.parse(fs.readFileSync(filename, 'utf8'))
          manifest.version = version
          fs.writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
        shell: bash
      - name: Commit released version to main
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: sync groma.md version to ${{ github.ref_name }}'
          branch: main
          file_pattern: package.json
